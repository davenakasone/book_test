# Render the demo book and every template on every push: proves a clean-machine RENDER, validates the
# EPUB (Java on the runner, so epubcheck runs), and publishes PDF/EPUB as a
# downloadable artifact per commit. Tag a vN.N.N release to attach the built
# files to a permanent GitHub Release (see the release job; publishing is
# parked, so no v* tags until it's unparked: parked/README.md).
#
# Note: this exercises the *render* off committed figures. The figure-gen
# scripts (make_figures.py / build_tikz.py) get their own job below so a
# stale committed figure or a rotted TinyTeX/matplotlib path is caught too.
name: build-book

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Mechanical manuscript review — same gate the author runs locally.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install codespell==2.4.2
      - name: check.py (Windows-encoding guard on)
        run: python check.py book
        env:
          # Windows-safety on a Linux runner: a text read/write without
          # encoding= is fatal (Windows would use cp1252), and stdout is cp1252
          # like a Windows pipe, so printing a non-cp1252 glyph (arrows) crashes.
          PYTHONWARNDEFAULTENCODING: "1"
          PYTHONWARNINGS: "error::EncodingWarning:__main__"
          PYTHONIOENCODING: cp1252

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38          # pinned to match requirements.txt
          tinytex: true

      - uses: actions/setup-java@v6   # epubcheck's JAR needs Java; declare it
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Render book (all formats, then the EPUB fix)
        run: python build.py book --skip-figures

      - name: Validate EPUB (epubcheck)
        run: |
          python -m pip install "epubcheck==5.1.0"
          epubcheck book/_book/The-Starlight-Engine.epub

      - uses: actions/upload-artifact@v7
        with:
          name: the-starlight-engine
          path: |
            book/_book/The-Starlight-Engine.pdf
            book/_book/The-Starlight-Engine.epub
          retention-days: 30

  # Figures + TikZ are NOT covered by the render job (it uses
  # committed outputs). Run them so an unpinned-dep rot or a stale committed
  # figure fails CI instead of surprising the friend.
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38
          tinytex: true
      - run: python -m pip install -r requirements.txt
      - name: Regenerate figures (proves the scripts still run clean-machine)
        env:
          SOURCE_DATE_EPOCH: "0"   # deterministic timestamps in PDF outputs
        run: |
          python book/scripts/make_figures.py
          python scripts/build_tikz.py --project book
      - name: Report drift (info only — PDF/PNG bytes are not stable across OSes)
        run: |
          # matplotlib/pdflatex outputs aren't byte-reproducible cross-platform
          # (fonts, compression, freetype), so drift here is INFO, not failure.
          # The real gate is the step above: the scripts must still execute.
          git diff --stat book/figures || true

  # Every template must still produce a working project from a clean
  # machine: new.py -> build.py -> check.py, per kind. Uploads the three
  # sample PDFs so a template change can be eyeballed from the Actions tab.
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38
          tinytex: true
      - uses: actions/setup-java@v6   # epubcheck
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements.txt
      # A failing command's log tail becomes an ::error annotation. Annotations
      # are readable through the public API without a GitHub login (job logs
      # aren't), so any session can diagnose a red run:
      #   curl -s https://api.github.com/repos/<owner>/<repo>/check-runs/<job-id>/annotations
      - name: Raw author files for new.py --from (UTF-8, UTF-8 with BOM, legacy cp1252)
        run: |
          raw="$RUNNER_TEMP/raw"; mkdir -p "$raw"
          printf '# Opening\n\nPlain UTF-8 prose \xe2\x86\x92 with an arrow.\n' > "$raw/01_opening.md"
          printf '\xef\xbb\xbfNotepad UTF-8 with a BOM: caf\xc3\xa9.\n' > "$raw/02_notes.txt"
          printf 'Legacy Windows ANSI: caf\xe9, \x93quoted\x94.\n' > "$raw/03_legacy.txt"
      - name: new.py -> build -> check, per kind
        env:
          # Windows-safety on a Linux runner: a text read/write without
          # encoding= is fatal (Windows would use cp1252), and stdout is cp1252
          # like a Windows pipe, so printing a non-cp1252 glyph (arrows) crashes.
          PYTHONWARNDEFAULTENCODING: "1"
          PYTHONWARNINGS: "error::EncodingWarning:__main__"
          PYTHONIOENCODING: cp1252
        run: |
          fail=0
          annotate() {  # $1 = label, $2 = log file
            python -c 'import sys; sys.stdout.reconfigure(encoding="utf-8"); t = open(sys.argv[2], encoding="utf-8", errors="replace").read()[-6000:]; print("::error title=" + sys.argv[1] + " failed::" + t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' "$1" "$2"
          }
          for kind in book article datasheet; do
            d="$RUNNER_TEMP/t-$kind"
            for step in new build check; do
              log="$RUNNER_TEMP/$kind-$step.log"
              rc=0  # `|| rc=$?`: the step shell runs with -e, so a bare failure would skip the annotation
              case $step in
                new)   from=(); [ "$kind" = book ] && from=(--from "$RUNNER_TEMP/raw")
                       python new.py "$kind" "$d" --title "CI $kind" "${from[@]}" > "$log" 2>&1 || rc=$? ;;
                build) python build.py "$d" --out "$RUNNER_TEMP/out-$kind" > "$log" 2>&1 || rc=$? ;;
                check) python check.py "$d" > "$log" 2>&1 || rc=$? ;;
              esac
              echo "::group::$kind $step (exit $rc)"; cat "$log"; echo "::endgroup::"
              if [ $rc -ne 0 ]; then annotate "$kind $step" "$log"; fail=1; break; fi
            done
          done
          exit $fail
      - name: --from wired the raw files in; --out delivered the documents
        run: |
          set -x
          for c in 01-opening 02-notes 03-legacy; do grep -q "chapters/$c.qmd" "$RUNNER_TEMP/t-book/_quarto.yml"; done
          if grep -q first-chapter "$RUNNER_TEMP/t-book/_quarto.yml"; then exit 1; fi  # (`! cmd` never fails under -e)
          grep -q "café" "$RUNNER_TEMP/t-book/chapters/03-legacy.qmd"
          ls "$RUNNER_TEMP"/out-book/*.pdf "$RUNNER_TEMP"/out-book/*.epub "$RUNNER_TEMP"/out-book/html/index.html
          ls "$RUNNER_TEMP"/out-article/article.pdf "$RUNNER_TEMP"/out-article/article.docx "$RUNNER_TEMP"/out-article/html/article.html
          ls "$RUNNER_TEMP"/out-datasheet/datasheet.pdf
          if ls "$RUNNER_TEMP"/t-*/build.py 2>/dev/null; then exit 1; fi  # projects carry no copies of the tools
      - name: Validate the book template's EPUB
        run: epubcheck "$RUNNER_TEMP"/out-book/*.epub
      - uses: actions/upload-artifact@v7
        with:
          name: template-samples
          path: |
            ${{ runner.temp }}/out-book/*.pdf
            ${{ runner.temp }}/out-article/article.pdf
            ${{ runner.temp }}/out-datasheet/datasheet.pdf
          retention-days: 30

  # On a version tag, attach the built book to a permanent GitHub Release —
  # the "registry": users download binaries from the Releases tab, and
  # releases/latest/download/<file> always serves the newest version.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38
          tinytex: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update -q && sudo apt-get install -y -q ghostscript
      - name: Render all formats + PDF/X-1a CMYK interior, delivered to dist/
        run: python build.py book --skip-figures --ingram --out dist
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/The-Starlight-Engine.pdf
            dist/The-Starlight-Engine.epub
            dist/The-Starlight-Engine-PDFX.pdf
