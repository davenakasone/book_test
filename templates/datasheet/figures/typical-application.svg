<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190" viewBox="0 0 520 190" font-family="sans-serif" font-size="11">
  <!-- Typical application: hand-written SVG, edit freely (any SVG tool works). -->
  <g stroke="#222" stroke-width="1.4" fill="none">
    <!-- VIN rail -->
    <line x1="20" y1="50" x2="170" y2="50"/>
    <!-- CIN -->
    <line x1="80" y1="50" x2="80" y2="90"/>
    <line x1="68" y1="90" x2="92" y2="90"/>
    <line x1="68" y1="98" x2="92" y2="98"/>
    <line x1="80" y1="98" x2="80" y2="160"/>
    <!-- IC -->
    <rect x="170" y="30" width="110" height="110" fill="#eef3f8"/>
    <!-- SW to inductor -->
    <line x1="280" y1="50" x2="320" y2="50"/>
    <path d="M320,50 q8,-12 16,0 q8,-12 16,0 q8,-12 16,0 q8,-12 16,0"/>
    <line x1="384" y1="50" x2="500" y2="50"/>
    <!-- COUT -->
    <line x1="450" y1="50" x2="450" y2="90"/>
    <line x1="438" y1="90" x2="462" y2="90"/>
    <line x1="438" y1="98" x2="462" y2="98"/>
    <line x1="450" y1="98" x2="450" y2="160"/>
    <!-- feedback divider -->
    <line x1="405" y1="50" x2="405" y2="70"/>
    <rect x="399" y="70" width="12" height="26"/>
    <line x1="405" y1="96" x2="405" y2="110"/>
    <rect x="399" y="110" width="12" height="26"/>
    <line x1="405" y1="136" x2="405" y2="160"/>
    <line x1="405" y1="103" x2="300" y2="103"/>
    <line x1="300" y1="103" x2="300" y2="120"/>
    <line x1="300" y1="120" x2="280" y2="120"/>
    <!-- ground rail -->
    <line x1="20" y1="160" x2="500" y2="160"/>
    <line x1="225" y1="140" x2="225" y2="160"/>
  </g>
  <g fill="#222">
    <text x="20" y="42" font-weight="bold">VIN 4.5 V to 36 V</text>
    <text x="96" y="97">CIN</text>
    <text x="225" y="80" text-anchor="middle" font-weight="bold" font-size="14">XR-1000</text>
    <text x="176" y="54" font-size="9">VIN</text>
    <text x="256" y="54" font-size="9">SW</text>
    <text x="258" y="124" font-size="9">FB</text>
    <text x="229" y="136" font-size="9">GND</text>
    <text x="352" y="38" text-anchor="middle">L</text>
    <text x="500" y="42" text-anchor="end" font-weight="bold">VOUT 5 V / 3 A</text>
    <text x="466" y="97">COUT</text>
    <text x="415" y="87">R1</text>
    <text x="415" y="127">R2</text>
    <text x="20" y="178">GND</text>
  </g>
</svg>
